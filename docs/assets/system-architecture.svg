<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">XMUMDorm system architecture</title>
  <desc id="desc">The React Web and Expo app clients call shared domain API modules. These send HTTP requests to the Express API, which uses MySQL for records and S3-compatible storage or local uploads for images.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#5e90ea"/></marker></defs>
  <rect width="1200" height="520" rx="18" fill="#f7f9fd"/><rect x="18" y="18" width="1164" height="484" rx="14" fill="#fff" stroke="#d7e2f3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="58" fill="#173874" font-size="15" font-weight="700" letter-spacing="2">RUNTIME ARCHITECTURE</text>
    <text x="48" y="83" fill="#6c7285" font-size="14">Two clients · one domain request layer · one HTTP service</text>
    <g fill="#e9f1fd" stroke="#9fbff6" stroke-width="1.5"><rect x="48" y="125" width="222" height="117" rx="12"/><rect x="48" y="274" width="222" height="117" rx="12"/></g>
    <g fill="#173874" font-weight="700" font-size="21"><text x="70" y="164">Web client</text><text x="70" y="313">Native app</text></g>
    <g fill="#4a5163" font-size="15"><text x="70" y="190">React 19 · Vite 7</text><text x="70" y="216">Browser experience</text><text x="70" y="339">Expo SDK 57 · Router</text><text x="70" y="365">React Native 0.86</text></g>
    <rect x="350" y="190" width="218" height="137" rx="12" fill="#173874"/>
    <text x="373" y="229" fill="#fff" font-size="20" font-weight="700">Shared API</text>
    <text x="373" y="258" fill="#dce8ff" font-size="15">Domain request modules</text>
    <text x="373" y="284" fill="#dce8ff" font-size="15">Platform injection</text>
    <text x="373" y="310" fill="#ffc300" font-size="13" font-weight="700">shared/api/</text>
    <rect x="648" y="168" width="240" height="181" rx="12" fill="#f4f7fd" stroke="#9fbff6" stroke-width="1.5"/>
    <text x="671" y="207" fill="#173874" font-size="21" font-weight="700">Express API</text>
    <text x="671" y="235" fill="#4a5163" font-size="15">Auth · rate limits · routes</text>
    <text x="671" y="261" fill="#4a5163" font-size="15">Business services · uploads</text>
    <path d="M670 283h192" stroke="#d7e2f3"/>
    <text x="671" y="312" fill="#2452a6" font-size="13" font-weight="700">server.js → routes/ → services/</text>
    <g fill="#fff" stroke="#9fbff6" stroke-width="1.5"><rect x="968" y="126" width="184" height="112" rx="12"/><rect x="968" y="279" width="184" height="112" rx="12"/></g>
    <g fill="#173874" font-size="20" font-weight="700"><text x="991" y="164">MySQL</text><text x="991" y="317">Images</text></g>
    <g fill="#4a5163" font-size="14"><text x="991" y="190">Connection pool</text><text x="991" y="214">Numbered migrations</text><text x="991" y="343">S3-compatible store</text><text x="991" y="367">or local uploads</text></g>
    <g fill="none" stroke="#5e90ea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M270 184h34v74h46"/><path d="M270 333h34v-75h46"/><path d="M568 258h80"/><path d="M888 218h40v-36h40"/><path d="M888 299h40v36h40"/>
    </g>
    <g fill="#4a5163" font-size="12" font-weight="700" letter-spacing=".6"><text x="285" y="174">CALL</text><text x="285" y="356">CALL</text><text x="581" y="246">HTTP</text><text x="902" y="170">SQL</text><text x="902" y="329">UPLOAD</text></g>
    <path d="M48 428h1104" stroke="#d7e2f3"/>
    <text x="48" y="462" fill="#6c7285" font-size="14">Client-specific UI and session handling stay on each platform; domain requests converge before reaching the API.</text>
  </g>
</svg>
