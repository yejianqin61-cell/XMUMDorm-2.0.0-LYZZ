name: app-rulers-and-tests

# 宪法 14.1：四把脚本必须接入 CI，作为**合并门**。
# 本工作流只跑"不需要账号"的门：四把尺子 + 类型检查 + App 单测。
# ⛔ 刻意**不**依赖 EXPO_TOKEN / EAS（把"能跑测试"与"能发构建"解耦）。

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'tokens/**'
      - 'scripts/**'
      - '.github/workflows/app-rulers-and-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'shared/**'
      - 'tokens/**'
      - 'scripts/**'
      - '.github/workflows/app-rulers-and-tests.yml'

jobs:
  rulers:
    name: 四把尺子（宪法 14.1）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: 安装依赖（npm ci，锁文件生效）
        working-directory: app
        run: npm ci
      - name: 尺子 1/4 · 设计债
        run: node scripts/design-debt-report.js --path app/src --fail-on-zero
      - name: 尺子 2/4 · 对比度
        run: node scripts/contrast-check.js --file tokens/generated/tokens.check.json --fail
      - name: 尺子 3/4 · 品牌色阶准入
        run: node scripts/brand-ramp.js --hue 261.2 --fail
      - name: 尺子 4/4 · 令牌生成自校验
        run: node scripts/gen-tokens.js --check

  app-tests:
    name: App 类型检查与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: 安装依赖（npm ci，锁文件生效）
        working-directory: app
        run: npm ci
      - name: 类型检查
        working-directory: app
        run: npm run typecheck
      - name: 单测
        working-directory: app
        run: npm run test:ci

  shared-tests:
    name: 共享层单测（Web 与 App 共用）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: 安装依赖（npm ci，锁文件生效）
        run: npm ci
      # ⚠️ 为什么需要这个 job（P2D-01 补漏）：
      #   `shared/**` 是 Web 与 App **共用**的代码（例如 `shared/api/auth.js`），
      #   而上面两个 job 的 paths 都不含它 → 改共享层**一个门都不会触发**。
      #   App 侧的 `MessageKey`/类型检查管不到这里，所以单列一个 job。
      - name: 共享层单测
        run: npx jest __tests__/shared --ci
